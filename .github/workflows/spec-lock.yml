# Written by spec-lock-rollout. A branch ruleset requires each job before its branch moves.
name: spec-lock
on:
  push:
    branches-ignore: ["main","integration/candidate"]
permissions:
  contents: read
jobs:
  spec-lock:
    name: "spec-lock"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EvanAgee/spec-lock@ef80acc113d68a3baf2ce94eaf43b8530eb4d6b8
  spec-lock-1:
    name: "spec-lock integration/candidate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EvanAgee/spec-lock@ef80acc113d68a3baf2ce94eaf43b8530eb4d6b8
        with:
          target: "integration/candidate"
